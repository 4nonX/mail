[package]
name = "flectar-proton-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Drives a locally managed Proton Mail Bridge core over its gRPC frontend."
publish = false

[lib]
# The generated proto types carry upstream doc comments with example gRPC
# service blocks; those are not Rust, so don't run them as doctests.
doctest = false

[dependencies]
tokio = { workspace = true, features = ["process"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3"

[dev-dependencies]
rcgen = "0.13"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
async-trait = "0.1"
